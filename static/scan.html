<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨课堂扫码签到</title>
<style>
  :root { --bd:#e2e4ea; --mut:#6b7280; --bg:#f5f6f8; --card:#fff; --blue:#185fa5; --green:#3b6d11; --red:#a32d2d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; min-height:100dvh; font:14px/1.6 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:#1c1e21; }
  [hidden] { display:none !important; }
  button { font:inherit; min-height:38px; padding:7px 14px; border-radius:6px; border:1px solid var(--bd); background:var(--card); cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.55; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .auth-gate { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:20px; }
  .auth-panel { width:min(360px,100%); padding:20px; background:var(--card); border:1px solid var(--bd); border-radius:8px; }
  h1 { font-size:18px; font-weight:600; }
  .auth-panel h1 { margin-bottom:12px; }
  .field { display:grid; gap:4px; margin-top:10px; color:var(--mut); font-size:12px; }
  .field input { width:100%; min-width:0; height:38px; padding:7px 9px; border:1px solid var(--bd); border-radius:6px; background:#fff; color:#1c1e21; font:14px/1.4 "Segoe UI",system-ui,sans-serif; }
  .auth-panel button { width:100%; margin-top:14px; }
  .message { min-height:22px; margin-top:8px; color:var(--mut); font-size:13px; overflow-wrap:anywhere; }
  .message.error { color:var(--red); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--bd); }
  header .spacer { flex:1; }
  main { width:min(680px,100%); margin:0 auto; padding:16px; }
  .scanner { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:16px; }
  #scanVideo { display:block; width:100%; aspect-ratio:4 / 3; border-radius:6px; background:#14161a; object-fit:cover; }
  .actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px; }
  .result { margin-top:12px; padding-top:12px; border-top:1px solid var(--bd); color:var(--mut); }
  .result strong { color:var(--green); font-weight:600; }
  @media (max-width:520px) {
    main { padding:10px; }
    .scanner { padding:12px; }
    .actions { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<section id="authGate" class="auth-gate">
  <div class="auth-panel">
    <h1>扫码签到</h1>
    <div id="authChecking" class="message">正在检查访问权限</div>
    <form id="authForm" autocomplete="off" hidden>
      <label class="field"><span>扫码页密码</span><input id="scanPassword" type="password" maxlength="128" autocomplete="current-password" required></label>
      <button id="btnLogin" class="primary" type="submit">进入扫码页</button>
      <div id="authError" class="message error" role="alert"></div>
    </form>
  </div>
</section>

<div id="scanShell" hidden>
  <header>
    <h1>扫码签到</h1>
    <div class="spacer"></div>
    <button id="btnLogout" type="button">退出</button>
  </header>
  <main>
    <section class="scanner">
      <video id="scanVideo" autoplay playsinline muted></video>
      <div class="actions">
        <button id="btnCamera" type="button">重新打开摄像头</button>
      </div>
      <div id="scanHint" class="message"></div>
      <div id="scanResult" class="result" hidden></div>
    </section>
  </main>
</div>

<script src="/vendor/jsQR.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let scanStream = null;
let scanFrame = null;
let scanDetector = null;
let nativeDetectorUnavailable = false;
let lastScanAttempt = 0;
let scannerAsAdmin = false;
let scannerStarted = false;
let submitting = false;
let cameraGeneration = 0;
const scanCanvas = document.createElement("canvas");
const scanContext = scanCanvas.getContext("2d", {willReadFrequently:true});

async function requestJSON(url, options) {
  const response = await fetch(url, options);
  let data = {};
  try { data = await response.json(); } catch (error) {}
  if (!response.ok) throw new Error(data.message || ("请求失败 HTTP " + response.status));
  return data;
}

function showLogin(message) {
  $("authChecking").hidden = true;
  $("authForm").hidden = false;
  $("authError").textContent = message || "";
  window.requestAnimationFrame(() => $("scanPassword").focus());
}

function showScanner() {
  $("authGate").hidden = true;
  $("scanShell").hidden = false;
  if (!scannerStarted) {
    scannerStarted = true;
    void openCamera();
  }
}

async function checkAccess() {
  try {
    const status = await requestJSON("/api/scanner/status");
    scannerAsAdmin = !!status.admin;
    if (scannerAsAdmin) $("btnLogout").textContent = "返回后台";
    if (status.authenticated) return showScanner();
    showLogin(status.configured ? "" : "管理员尚未配置扫码页密码");
  } catch (error) {
    showLogin("无法检查扫码页权限");
  }
}

function stopCamera() {
  cameraGeneration += 1;
  if (scanFrame !== null) window.cancelAnimationFrame(scanFrame);
  scanFrame = null;
  if (scanStream) for (const track of scanStream.getTracks()) track.stop();
  scanStream = null;
  const video = $("scanVideo");
  video.srcObject = null;
}

async function getNativeDetector() {
  if (nativeDetectorUnavailable || !("BarcodeDetector" in window)) return null;
  if (scanDetector) return scanDetector;
  try {
    if (typeof BarcodeDetector.getSupportedFormats === "function") {
      const formats = await BarcodeDetector.getSupportedFormats();
      if (!formats.includes("qr_code")) throw new Error("QR unavailable");
    }
    scanDetector = new BarcodeDetector({formats:["qr_code"]});
    return scanDetector;
  } catch (error) {
    nativeDetectorUnavailable = true;
    return null;
  }
}

function decodeWithJsQR(source) {
  if (typeof window.jsQR !== "function" || !scanContext) return "";
  const sourceWidth = source.videoWidth || source.naturalWidth || source.width || 0;
  const sourceHeight = source.videoHeight || source.naturalHeight || source.height || 0;
  if (!sourceWidth || !sourceHeight) return "";
  const scale = Math.min(1, 960 / sourceWidth);
  const width = Math.max(1, Math.round(sourceWidth * scale));
  const height = Math.max(1, Math.round(sourceHeight * scale));
  if (scanCanvas.width !== width || scanCanvas.height !== height) {
    scanCanvas.width = width;
    scanCanvas.height = height;
  }
  scanContext.drawImage(source, 0, 0, width, height);
  const image = scanContext.getImageData(0, 0, width, height);
  const result = window.jsQR(image.data, width, height, {inversionAttempts:"attemptBoth"});
  return result && result.data ? result.data : "";
}

async function detectCode(source) {
  const detector = await getNativeDetector();
  if (detector) {
    try {
      const codes = await detector.detect(source);
      if (codes.length && codes[0].rawValue) return codes[0].rawValue;
    } catch (error) {
      nativeDetectorUnavailable = true;
      scanDetector = null;
    }
  }
  const value = decodeWithJsQR(source);
  if (value) return value;
  if (!detector && typeof window.jsQR !== "function") {
    throw new Error("当前浏览器不支持二维码识别，请更换浏览器");
  }
  return "";
}

function acceptCode(value) {
  if (!value) return false;
  stopCamera();
  $("scanHint").textContent = "已识别二维码，正在自动签到";
  void submitCode(value);
  return true;
}

async function processScanFrame(generation) {
  if (generation !== cameraGeneration || !scanStream) return;
  const now = performance.now();
  if (now - lastScanAttempt < 120) {
    scanFrame = window.requestAnimationFrame(() => processScanFrame(generation));
    return;
  }
  lastScanAttempt = now;
  try {
    const value = await detectCode($("scanVideo"));
    if (generation !== cameraGeneration || !scanStream) return;
    if (acceptCode(value)) return;
  } catch (error) {}
  if (generation === cameraGeneration && scanStream) {
    scanFrame = window.requestAnimationFrame(() => processScanFrame(generation));
  }
}

async function configureFocus(track) {
  if (!track || typeof track.getCapabilities !== "function"
      || typeof track.applyConstraints !== "function") return;
  try {
    const capabilities = track.getCapabilities();
    const modes = Array.isArray(capabilities.focusMode)
      ? capabilities.focusMode
      : (capabilities.focusMode ? [capabilities.focusMode] : []);
    if (modes.includes("continuous")) {
      await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
    }
  } catch (error) {}
}

async function openCamera() {
  stopCamera();
  const generation = cameraGeneration;
  const hint = $("scanHint");
  let candidateStream = null;
  hint.textContent = "正在打开摄像头";
  try {
    if (!("mediaDevices" in navigator) || !navigator.mediaDevices.getUserMedia) {
      throw new Error("当前浏览器无法访问摄像头");
    }
    candidateStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30, max:30}
      },
      audio:false
    });
    if (generation !== cameraGeneration || document.hidden) {
      for (const staleTrack of candidateStream.getTracks()) staleTrack.stop();
      return;
    }
    const track = candidateStream.getVideoTracks()[0];
    if ("contentHint" in track) track.contentHint = "detail";
    await configureFocus(track);
    if (generation !== cameraGeneration || document.hidden) {
      for (const staleTrack of candidateStream.getTracks()) staleTrack.stop();
      return;
    }
    scanStream = candidateStream;
    const video = $("scanVideo");
    video.srcObject = scanStream;
    await video.play();
    if (generation !== cameraGeneration || document.hidden) return;
    lastScanAttempt = 0;
    hint.textContent = "正在识别二维码";
    scanFrame = window.requestAnimationFrame(() => processScanFrame(generation));
  } catch (error) {
    if (candidateStream && candidateStream !== scanStream) {
      for (const staleTrack of candidateStream.getTracks()) staleTrack.stop();
    }
    if (generation !== cameraGeneration) return;
    stopCamera();
    hint.textContent = (!window.isSecureContext && location.hostname !== "localhost"
                        && location.hostname !== "127.0.0.1")
      ? "浏览器摄像头需要 HTTPS，请改用 HTTPS 后重试"
      : (error && error.name === "NotAllowedError"
          ? "摄像头权限被拒绝，请允许访问后重试"
          : (error.message || "无法打开摄像头"));
  }
}

function failureLabel(reason) {
  return ({
    not_enrolled:"未加入课程", expired:"二维码已过期",
    authorization:"账号授权失效", failed:"其他失败"
  })[reason] || "失败";
}

$("authForm").onsubmit = async event => {
  event.preventDefault();
  const button = $("btnLogin");
  const password = $("scanPassword").value;
  button.disabled = true;
  $("authError").textContent = "";
  try {
    await requestJSON("/api/scanner/login", {
      method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({password})
    });
    $("scanPassword").value = "";
    showScanner();
  } catch (error) {
    $("scanPassword").value = "";
    $("authError").textContent = error.message;
  } finally {
    button.disabled = false;
  }
};

$("btnLogout").onclick = async () => {
  if (scannerAsAdmin) {
    window.location.href = "/";
    return;
  }
  try {
    await requestJSON("/api/scanner/logout", {
      method:"POST", headers:{"content-type":"application/json"}, body:"{}"
    });
  } finally {
    window.location.reload();
  }
};
$("btnCamera").onclick = openCamera;
async function submitCode(content) {
  if (!content || submitting) return;
  submitting = true;
  $("scanHint").textContent = "正在签到";
  $("scanResult").hidden = true;
  try {
    const result = await requestJSON("/api/accounts/scan-all", {
      method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({qr_content:content})
    });
    const details = result.failures
      ? Object.entries(result.failures).map(([reason,count]) => failureLabel(reason) + " " + count).join("，")
      : (result.results || []).filter(item => !item.ok)
          .map(item => (item.account_name || "账号") + "：" + (item.message || "失败")).join("；");
    const resultBox = $("scanResult");
    resultBox.replaceChildren();
    const summary = document.createElement("strong");
    summary.textContent = "签到完成 " + result.success + "/" + result.total;
    resultBox.appendChild(summary);
    if (details) resultBox.appendChild(document.createTextNode(" · " + details));
    resultBox.hidden = false;
    $("scanHint").textContent = "";
  } catch (error) {
    $("scanHint").textContent = error.message;
  } finally {
    submitting = false;
  }
}
window.addEventListener("pagehide", stopCamera);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
});
void checkAccess();
</script>
</body>
</html>
